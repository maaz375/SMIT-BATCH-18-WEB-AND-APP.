<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- Add Student -->
    <div class="card">
        <h3>Add Student</h3>
        <div class="form-group">
            <input type="text" id="name" placeholder="Name">
            <input type="number" id="age" placeholder="Age">
            <input type="number" id="marks" placeholder="Marks">
        </div>
        <button class="add-btn" onclick="addStudent()">Add Student</button>
    </div>

    <!-- Student List -->
    <div class="card">
        <h3>Student List</h3>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Marks</th>
                    <th>Result</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>

        <div class="footer">
            Total Students: <span id="total">0</span>
        </div>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>



    <script src="app.js"></script>
</body>

</html>
