<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="signup.css">
    <title>Sign Up Social Lite</title>
</head>

<body>


    <div class="div1">
        <h1>Sign Up</h1>

        <p class="p1">Join Social Lite and be part of the conversation.</p>


        <p class="p2-1">First Name:</p>
        <input required type="text" id="firstName">

        <p class="p2">Last Name:</p>
        <input required type="text" id="lastName">

        <p class="p2">Email:</p>
        <input required type="email" id="email">

        <p class="p2">Password:</p>
        <input required type="password" id="password">

        <p class="p2">Confirm Password:</p>
        <input required type="password" id="confirmPassword">


        <div class="check">
            <input type="checkbox" id="agree">
        </div>

        <p class="p3">I agree with Privacy Policy & Terms and Conditions.</p>


        <button onclick="signup()">Sign Up</button>


        <p class="p4">Already have an account?</p>


        <div class="log">
            <a href="login.html">login</a>
        </div>


    </div>


    <script src="signup.js"></script>
</body>

</html>
