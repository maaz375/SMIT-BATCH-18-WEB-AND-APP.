<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Social Lite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="web.css">
</head>
<body>

<header class="top-shell">
  <div class="container mt-3">
    <div class="topbar-card">
      <div class="topbar-main">
        <h5 id="welcomeUser"></h5>

        <button class="hamburger-btn d-md-none" id="menuToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

      <div class="topbar-actions d-none d-md-flex gap-2">
        <button class="btn btn-dark btn-sm" onclick="toggleDarkMode()">Dark Mode</button>
        <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
      </div>

      <div class="mobile-menu d-md-none" id="mobileMenu">
        <div class="mobile-actions">
          <button class="btn btn-dark btn-sm" onclick="toggleDarkMode()">Dark Mode</button>
          <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="container mt-3">
  <input type="text" id="search" class="form-control" placeholder="Search posts or users...">
</div>

<div class="container d-flex justify-content-center mt-3">
  <div class="card p-4 main-card w-100">
    <textarea id="content" class="form-control mb-2" placeholder="What's on your mind?"></textarea>
    <input type="file" id="imageInput" class="form-control mb-2">
    <button class="btn btn-primary w-100" id="postBtn">Post</button>
  </div>
</div>

<div class="container mt-3">
  <div id="undoBox" class="alert alert-warning d-none d-flex justify-content-between">
    <span>Post deleted</span>
    <button class="btn btn-sm btn-dark" onclick="undoDelete()">Undo</button>
  </div>
</div>

<div class="container mt-3">
  <div id="posts"></div>
</div>

<div class="modal fade" id="editModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Edit Post</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <textarea id="editContent" class="form-control"></textarea>
      </div>

      <div class="modal-footer">
        <button class="btn btn-success" id="updateBtn">Update</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="web.js"></script>

</body>
</html>
