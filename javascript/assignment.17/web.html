<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Social Lite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="web.css">
</head>
<body>

<!-- TOP BAR -->
<div class="container mt-3 d-flex justify-content-between align-items-center">
  <h5 id="welcomeUser"></h5>

  <div class="d-flex gap-2">
    <button class="btn btn-dark btn-sm" onclick="toggleDarkMode()">🌙</button>
    <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
  </div>
</div>

<!-- SEARCH -->
<div class="container mt-3">
  <input type="text" id="search" class="form-control" placeholder="Search posts or users...">
</div>

<!-- CREATE POST -->
<div class="container d-flex justify-content-center mt-3">
  <div class="card p-4 main-card w-100">

    <textarea id="content" class="form-control mb-2" placeholder="What's on your mind?"></textarea>

    <input type="file" id="imageInput" class="form-control mb-2">

    <button class="btn btn-primary w-100" id="postBtn">Post</button>

  </div>
</div>

<!-- UNDO -->
<div class="container mt-3">
  <div id="undoBox" class="alert alert-warning d-none d-flex justify-content-between">
    <span>Post deleted</span>
    <button class="btn btn-sm btn-dark" onclick="undoDelete()">Undo</button>
  </div>
</div>

<!-- POSTS -->
<div class="container mt-3">
  <div id="posts"></div>
</div>

<!-- EDIT MODAL -->
<div class="modal fade" id="editModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5>Edit Post</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <textarea id="editContent" class="form-control"></textarea>
      </div>

      <div class="modal-footer">
        <button class="btn btn-success" id="updateBtn">Update</button>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="web.js"></script>

</body>
</html>
