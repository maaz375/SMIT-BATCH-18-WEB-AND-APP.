<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <title>Log In Social Lite</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="div1">
        <h1>Log In</h1>

        <p class="p1">Welcome back-continue your experience with Social Lite</p>

        <div class="form-area">
            <p class="p2-1">Email:</p>
            <input required type="email" id="email">

            <p class="p2">Password:</p>
            <input required type="password" id="password">


            <div class="fp">
                <a class="a1" href="forget.html">Forget Password?</a>
            </div>


            <button onclick="login()">Log In</button>

            <p class="p3">Does not have any account?</p>


            <div class="log">
                <a class="a2" href="signup.html">Signup</a>
            </div>
        </div>


    </div>


    <script src="login.js"></script>
</body>

</html>
