<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div>

        <input type="text" id="display" readonly>
        <br>

        <button class="clear wide" onclick="clearAll()">AC</button>
        <button class="clear" onclick="del()">C</button>
        <button class="operator" onclick="operator('/')">/</button>
        <br>

        <button onclick="number('7')" class="number">7</button>
        <button onclick="number('8')" class="number">8</button>
        <button onclick="number('9')" class="number">9</button>
        <button onclick="operator('*')" class="operator">*</button>
        <br>

        <button class="number" onclick="number('4')">4</button>
        <button class="number" onclick="number('5')">5</button>
        <button class="number" onclick="number('6')">6</button>
        <button class="operator" onclick="operator('-')">-</button>
        <br>

        <button class="number" onclick="number('1')">1</button>
        <button class="number" onclick="number('2')">2</button>
        <button class="number" onclick="number('3')">3</button>
        <button class="operator" onclick="operator('+')">+</button>
        <br>

        <button class="number" onclick="number('0')">0</button>
        <button class="number" onclick="number('.')">.</button>
        <button class="equals wide" onclick="compute()">=</button>

    </div>





    <script src="app.js"></script>
</body>

</html>
