<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flat sign Up</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,600;1,14..32,600&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="parent">

        <img src="./bgimg.png" alt="">

        <h1>
            flat sign up form
        </h1>

        <div class="child">

            <h3>
                sign up
            </h3>

            <form action="">
                <input required type="text" placeholder="First Name">
                <input required type="text" placeholder="Last Name">
                <input required type="number" placeholder="Phone Number">
                <input required type="email" placeholder="Email">
                <input required type="password" placeholder="Password">
                <input required type="password" placeholder="Confirm Password">
                <button>sign up</button>
            </form>

        </div>

    </div>


</body>

</html>
